<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sohan Saldanha portfolio favicon</title>
  <desc id="desc">A modern S monogram with circuit nodes on a dark gradient background.</desc>

  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#10112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="17" y1="17" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="2"/>

  <path
    d="M45 19.5C41.8 16.9 37.6 15.5 32.7 15.5C24.8 15.5 19 19.3 19 25C19 30.5 23.4 32.5 31.9 34.2C38.2 35.5 41 36.5 41 39.3C41 42.5 37.5 44.5 32.4 44.5C27.2 44.5 22.7 42.7 19 39.5"
    fill="none"
    stroke="#f8fafc"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g fill="url(#accent)" filter="url(#glow)">
    <circle cx="45" cy="19.5" r="3.2"/>
    <circle cx="19" cy="39.5" r="3.2"/>
    <circle cx="19" cy="25" r="2.2"/>
    <circle cx="41" cy="39.3" r="2.2"/>
  </g>
</svg>
